      description: 每行一个 CIDR，同时支持 IPv4 和 IPv6 格式。例如 10.0.0.0/8 或 2001:da8::/32。留空则禁用 IP 校验。
    validity-period:
      title: 有效期（天）
      description: 在校状态的有效天数，从认证时间起算。默认 365 天（一年）。
    benefits:
      title: 认证福利
      description: 在校认证页面上展示的福利信息，支持 Markdown 语法。留空则不显示福利版块。
